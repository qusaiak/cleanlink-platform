name: client_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0-333.2.beta

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.1.0
  equatable: ^2.0.8
  dio: ^5.9.2
  get_it: ^9.2.1
  dartz: ^0.10.1
  internet_connection_checker: ^3.0.1
  flutter_screenutil: ^5.9.3
  pinput: ^6.0.2
  go_router: ^17.2.0
  flutter_svg: ^2.2.4
  flutter_spinkit: ^5.2.2
  lottie: ^3.3.3
  flutter_localization: ^0.4.0
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  fluttertoast: ^9.0.0
  retrofit: ^4.9.2
  flutter_secure_storage: ^10.1.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  flutter_local_notifications: ^21.0.0
  flutter_dotenv: ^6.0.1
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
  firebase_analytics: ^12.4.2
  carousel_slider: ^5.1.2
  json_annotation: ^4.12.0
  image_picker: ^1.2.2
  skeletonizer: ^2.1.3
  intl: ^0.20.2
  flutter_launcher_icons: ^0.14.4
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: 12.0.3
  flutter_stripe: ^14.0.0
  flutter_markdown_plus: ^1.0.12
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  build_runner: ^2.13.1
  flutter_gen_runner: ^5.13.0+1
  retrofit_generator: ^10.2.3


  flutter_lints: ^6.0.0
  json_serializable: ^6.14.0

flutter_launcher_icons:
  android: true
  ios: true

  # Standard icon and iOS icon
  image_path: "assets/icons/app_icon.png"

  # Android adaptive icon
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"


  remove_alpha_ios: true

flutter_gen:
  output: lib/core/utils/gen/
  line_length: 1000 # Optional (default: 80)

  # Optional
  integrations:
    flutter_svg: true
    rive: true
    lottie: true

flutter:
  generate: true
  uses-material-design: true

  assets:
    - local_config.env
    - assets/images/
    - assets/images/placeholders/
    - assets/images/onboarding/
    - assets/images/logo/
    - assets/images/test/
    - assets/images/search/
    - assets/icons/
    - assets/animations/


  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/poppins_medium.ttf
        - asset: assets/fonts/poppins/poppins_regular.ttf
        - asset: assets/fonts/poppins/poppins_semibold.ttf
        - asset: assets/fonts/poppins/poppins_thin.ttf

    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/cairo_medium.ttf
        - asset: assets/fonts/cairo/cairo_regular.ttf
        - asset: assets/fonts/cairo/cairo_semibold.ttf
