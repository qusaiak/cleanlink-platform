name: worker_app
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0-333.2.beta

dependencies:
  flutter:
    sdk: flutter
  # lib/l10n/app_localizations.dart imports this directly. It used to arrive
  # only as a transitive dep of the third-party `flutter_localization` package,
  # which is fragile; declared explicitly now.
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  image_picker: ^1.2.2
  dio: ^5.9.2
  get_it: ^9.2.1
  dartz: ^0.10.1
  internet_connection_checker: ^3.0.1
  flutter_screenutil: ^5.9.3
  pinput: ^6.0.2
  go_router: ^17.2.0
  flutter_svg: ^2.2.4
  lottie: ^3.3.3
  url_launcher: ^6.3.2
  google_maps_flutter: ^2.18.0
  cached_network_image: ^3.4.1
  fluttertoast: ^9.0.0
  shared_preferences: ^2.5.5
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.0.1
  device_info_plus: ^13.2.0
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.13.1
  flutter_lints: ^5.0.0
  flutter_gen_runner: ^5.13.0+1

flutter_launcher_icons:
  android: true
  ios: true

  # Standard icon and iOS icon
  image_path: "assets/icons/app_icon.png"

  # Android adaptive icon
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"


  remove_alpha_ios: true

flutter_gen:
  output: lib/core/utils/gen/
  line_length: 1000 # Optional (default: 80)

  # Optional
  integrations:
    flutter_svg: true
    rive: true
    lottie: true

flutter:

  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/placeholders/
    - assets/images/onboarding/
    - assets/images/logo/
    - assets/images/test/
    - assets/icons/


  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/poppins_medium.ttf
        - asset: assets/fonts/poppins/poppins_regular.ttf
        - asset: assets/fonts/poppins/poppins_semibold.ttf
        - asset: assets/fonts/poppins/poppins_thin.ttf

    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/cairo_medium.ttf
        - asset: assets/fonts/cairo/cairo_regular.ttf
        - asset: assets/fonts/cairo/cairo_semibold.ttf
