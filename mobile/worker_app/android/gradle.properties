# ---------------------------------------------------------------------------
# JVM sizing
# ---------------------------------------------------------------------------
# Sizing rule: total RAM minus what everything else needs, then split between
# the two JVMs Gradle actually starts. This machine has 18 GB, and in practice
# Android Studio (~2-3 GB), the emulator (~2-4 GB), the Dart frontend_server
# (~1 GB) and Windows itself (~3 GB) are already resident. That leaves roughly
# 4-5 GB to divide, hence 3 GB + 1.5 GB below.
#
# A heap larger than free RAM is actively slower: Windows pages it to disk and
# every GC touches swap. The previous -Xmx8G -XX:MaxMetaspaceSize=4G asked for
# 12 GB from a machine with 3.2 GB free.
#
# Metaspace holds class metadata only; a Flutter Android build uses ~300-500 MB,
# so 768m is generous. Raise -Xmx to 4G only if you see OutOfMemoryError.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# The Kotlin compile daemon is a SEPARATE JVM and does NOT inherit the line
# above. Unset, it picks its own large default and competes for the same RAM.
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m

# ---------------------------------------------------------------------------
# Gradle execution
# ---------------------------------------------------------------------------
# Keeps a warm JVM between builds so the second build skips ~10 s of startup.
org.gradle.daemon=true

# Builds independent subprojects concurrently. A Flutter app is NOT a single
# module -- every plugin (firebase_core, firebase_messaging, image_picker,
# flutter_local_notifications, url_launcher, shared_preferences,
# device_info_plus, path_provider, ...) is its own Gradle subproject, so there
# are ~12 modules here and this is a real win on 8 cores.
# Risk: none for this project; only unsafe for builds that share mutable state
# across modules, which Flutter plugin modules do not.
org.gradle.parallel=true

# Reuses task OUTPUTS across builds, and across `flutter clean`, via a local
# cache in ~/.gradle/caches/build-cache-1. This is the flag that makes a
# rebuild-after-clean cheap instead of full price.
# Risk: a badly-declared task could serve a stale output; `--rerun-tasks`
# bypasses the cache if you ever suspect that.
org.gradle.caching=true

# Configures only the subprojects a task actually needs instead of all ~12.
# Risk: low, and it degrades gracefully -- worst case it configures everything.
org.gradle.configureondemand=true

# Optional, higher-risk, MEASURE BEFORE KEEPING. Enable ONE AT A TIME and
# confirm a cold `flutter clean && flutter run` still succeeds:
#
#   Caches the whole configuration phase. Largest remaining win (~5-15 s/build)
#   but some Flutter/Firebase plugin versions are not yet compatible.
# org.gradle.configuration-cache=true
#
#   Runs kotlinc inside the Gradle daemon instead of a second JVM. On a
#   RAM-constrained machine this often wins; bump -Xmx3G to -Xmx4G if you use it.
# kotlin.compiler.execution.strategy=in-process

# ---------------------------------------------------------------------------
# Kotlin
# ---------------------------------------------------------------------------
# Recompiles only changed Kotlin sources. Default is already true on Kotlin 2.x;
# stated explicitly so a future toolchain change cannot silently drop it.
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# ---------------------------------------------------------------------------
# Android
# ---------------------------------------------------------------------------
android.useAndroidX=true

# android.enableJetifier was REMOVED (it was true).
# Jetifier rewrites the bytecode of every dependency on the classpath to
# translate legacy android.support.* references to androidx.*. It runs as an
# artifact transform over the entire dependency graph and is one of the most
# expensive things in a modern Android build -- for zero benefit here, because
# every plugin in this project (Firebase 4.x/16.x, AGP 8.9, all pub plugins) is
# already AndroidX-native.
# If a build ever fails with "class android.support.v4...not found", re-add it.

# Generates per-module R classes without inlining the whole transitive resource
# table, so touching one module's resources does not invalidate the others.
# Default true on AGP 8.x; explicit for the same reason as kotlin.incremental.
android.nonTransitiveRClass=true

# NOTE on android.enableR8.fullMode: deliberately NOT set here. It has defaulted
# to true since AGP 8.0, so writing it changes nothing, and it only affects
# RELEASE builds -- R8 never runs on debug. See android/app/build.gradle.kts:
# the debug build type has no minify/shrink enabled, which is correct.
